name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: version_133

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p box2d -p physics -p macroquad_gui --all-features --all-targets -- -D warnings
      - run: cargo test --locked -p box2d -p physics -p macroquad_gui --all-features

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The winit gui builds for the web only.
      - run: cargo clippy --locked -p wgpu-gui --target wasm32-unknown-unknown -- -D warnings

      - name: Read wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          ver=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - name: Install binaryen
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - run: ./gui/build.sh
      - run: ./gui_macroquad/build.sh

      - name: Assemble site
        run: |
          mkdir -p site/winit_version site/macroquad_version
          cp gui/index.html site/winit_version/
          cp -r gui/pkg site/winit_version/
          cp gui_macroquad/index.html site/macroquad_version/
          cp -r gui_macroquad/pkg site/macroquad_version/
          rm -f site/*/pkg/.gitignore
          ls -lR site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
