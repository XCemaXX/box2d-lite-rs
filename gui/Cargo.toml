[package]
name = "wgpu-gui"
version = "0.2.0"
authors = ["XCemaXX <xcemaxx@gmail.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
physics = { path = "../physics" }
rand = "0.10.3"

console_error_panic_hook = { version = "0.1.7", optional = true }
console_log = "1.1.0"
log = "0.4.34"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "30.0.1", default-features = false, features = ["webgl"] }
wgpu_text = "30.0.1"
bytemuck = "1.25.2"
web-sys = { version = "0.3.106", features = [
    "Window",
    "Document",
    "HtmlElement",
    "Node",
    "Text",
] }
futures = "0.3.34"
web-time = "1.1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
